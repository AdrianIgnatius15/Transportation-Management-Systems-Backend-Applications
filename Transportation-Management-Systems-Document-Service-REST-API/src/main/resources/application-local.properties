spring.application.name=document-service-rest-api
spring.datasource.url=jdbc:postgresql://localhost:5432/tms
spring.datasource.username=tms
spring.datasource.password=tms@2367
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=tms
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# SeaweedFS S3 Settings
seaweedfs.access-key=admin
seaweedfs.secret-key=password123
seaweedfs.region=us-east-1
seaweedfs.bucket-name=tms-documents
seaweedfs.internal-endpoint=http://localhost:8333
seaweedfs.public-endpoint=http://localhost:8333
seaweedfs.filer.url=http://localhost:8888
cloud.aws.s3.endpoint=http://localhost:8333
cloud.aws.region.static=us-east-1